name: Check Candidate Build

on:
  workflow_dispatch:
    inputs:
      b5_commit:
        description: Exact 40-hex commit in BurnoutDecomp/b5-decomp
        required: true
        type: string
      run_regressions:
        description: Run the existing profile-delivery and GUI-interface production fixtures
        required: false
        default: false
        type: boolean
      run_apt_lifetime:
        description: Run imported APT bundle ownership checks and their negative controls
        required: false
        default: false
        type: boolean
      run_hud_regressions:
        description: Run recovered Road Rage producers and existing HUD crash fixtures
        required: false
        default: false
        type: boolean
      run_resource_regressions:
        description: Run recovered pool protocol, transport and GameData hierarchy fixtures
        required: false
        default: false
        type: boolean
      run_gui_io_regressions:
        description: Run original GUI Model and Interpreter IO lifecycle fixtures
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout the workflow's exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          submodules: false
          persist-credentials: false

      - name: Set up MSVC (x64, Windows 2022)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Reuse only candidate objects from the same MSVC toolset and build flags.
      # compile_exe.py checks source/header contents with BRN_EXE_HASH_DEPS=1.
      - name: Restore compiler objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: build/game/obj/tu
          key: candidate-exe-objs-${{ runner.os }}-${{ hashFiles('tools/build/msvc_flags.txt', 'tools/build/msvc_includes.txt') }}-${{ env.VCToolsVersion }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candidate-exe-objs-${{ runner.os }}-${{ hashFiles('tools/build/msvc_flags.txt', 'tools/build/msvc_includes.txt') }}-${{ env.VCToolsVersion }}-

      - name: Build and check candidate (no publish or game)
        shell: pwsh
        env:
          CANDIDATE_B5_SHA: ${{ inputs.b5_commit }}
          CANDIDATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_WORKFLOW_REF: ${{ github.workflow_ref }}
          CANDIDATE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CANDIDATE_RUN_REGRESSIONS: ${{ inputs.run_regressions }}
          CANDIDATE_RUN_APT_LIFETIME: ${{ inputs.run_apt_lifetime }}
          CANDIDATE_RUN_HUD_REGRESSIONS: ${{ inputs.run_hud_regressions }}
          CANDIDATE_RUN_RESOURCE_REGRESSIONS: ${{ inputs.run_resource_regressions }}
          CANDIDATE_RUN_GUI_IO_REGRESSIONS: ${{ inputs.run_gui_io_regressions }}
          GH_TOKEN: ${{ github.token }}
          BRN_EXE_HASH_DEPS: "1"
          BRN_EXE_JOBS: "4"
        run: |
          ./ci/check-candidate-build.ps1 -B5Commit $env:CANDIDATE_B5_SHA `
            -WorkflowSha $env:CANDIDATE_WORKFLOW_SHA -Jobs 4 `
            -RunRegressions:($env:CANDIDATE_RUN_REGRESSIONS -eq 'true') `
            -RunAptLifetime:($env:CANDIDATE_RUN_APT_LIFETIME -eq 'true') `
            -RunHudRegressions:($env:CANDIDATE_RUN_HUD_REGRESSIONS -eq 'true') `
            -RunResourceRegressions:($env:CANDIDATE_RUN_RESOURCE_REGRESSIONS -eq 'true') `
            -RunGuiIORegressions:($env:CANDIDATE_RUN_GUI_IO_REGRESSIONS -eq 'true')

      - name: Save successful candidate objects
        if: success()
        uses: actions/cache/save@v4
        with:
          path: build/game/obj/tu
          key: ${{ steps.objects.outputs.cache-primary-key }}

      - name: Upload build outputs and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/candidate/artifacts/Burnout_PC.exe
            build/candidate/artifacts/Burnout_PC.map
            build/candidate/artifacts/Burnout_PC.cgsmap
            build/candidate/artifacts/Burnout_PC.exe.provenance.json
            build/candidate/artifacts/*.dll
            build/candidate/artifacts/*.log
            build/candidate/artifacts/input-receipt.json
            build/candidate/artifacts/resource-regressions/**
            build/candidate/artifacts/gui-io-regressions/**
            build/candidate/artifacts/hud-regressions/**
          if-no-files-found: error
          retention-days: 1
