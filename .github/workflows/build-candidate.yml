name: Check Candidate Build

on:
  workflow_dispatch:
    inputs:
      b5_commit:
        description: Exact 40-hex commit in BurnoutDecomp/b5-decomp
        required: true
        type: string
      run_regressions:
        description: Run the existing profile-delivery and GUI-interface production fixtures
        required: false
        default: false
        type: boolean
      run_apt_lifetime:
        description: Run imported APT bundle ownership checks and their negative controls
        required: false
        default: false
        type: boolean
      run_hud_regressions:
        description: Run recovered Road Rage producers and existing HUD crash fixtures
        required: false
        default: false
        type: boolean
      run_resource_regressions:
        description: Run recovered pool protocol, transport and GameData hierarchy fixtures
        required: false
        default: false
        type: boolean
      run_gui_license_regressions:
        description: Run fresh-profile licence handoff checks and the old event-order control
        required: false
        default: false
        type: boolean
      run_startup_io_regressions:
        description: Run input-buffer initialization and GUI GameData lock ownership checks
        required: false
        default: false
        type: boolean
      run_gui_animation_regressions:
        description: Run original GUI animation initialization and its omission control
        required: false
        default: false
        type: boolean
      run_gui_io_regressions:
        description: Run original GUI Model and Interpreter IO lifecycle fixtures
        required: false
        default: false
        type: boolean

      run_keyboard_ui_contract:
        description: Run the native PC keyboard contract on hosted Windows 2022
        required: false
        default: false
        type: boolean
      run_rwac_command_capacity:
        description: Run the bounded RWAC capacity diagnostic and original-source control
        required: false
        default: false
        type: boolean
      run_traffic_flowtype_override:
        description: Run the 44-check Traffic flowtype fixture and exact old-return control
        required: false
        default: false
        type: boolean
      run_system_user_profile:
        description: Run the native SystemUserProfile API and legacy failure controls
        required: false
        default: false
        type: boolean
      run_online_save_route:
        description: Run actual-body online route transfers and original trap/init controls
        required: false
        default: false
        type: boolean

      run_gui_menu_music_wire:
        description: Run original menu-music payload decoding and unchanged old-consumer control
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout the workflow's exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          submodules: false
          persist-credentials: false

      - name: Set up MSVC (x64, Windows 2022)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Reuse only candidate objects from the same MSVC toolset and build flags.
      # compile_exe.py checks source/header contents with BRN_EXE_HASH_DEPS=1.
      - name: Restore compiler objects
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: build/game/obj/tu
          key: candidate-exe-objs-${{ runner.os }}-${{ hashFiles('tools/build/msvc_flags.txt', 'tools/build/msvc_includes.txt') }}-${{ env.VCToolsVersion }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candidate-exe-objs-${{ runner.os }}-${{ hashFiles('tools/build/msvc_flags.txt', 'tools/build/msvc_includes.txt') }}-${{ env.VCToolsVersion }}-

      - name: Build and check candidate (no publish or game)
        shell: pwsh
        env:
          CANDIDATE_B5_SHA: ${{ inputs.b5_commit }}
          CANDIDATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_WORKFLOW_REF: ${{ github.workflow_ref }}
          CANDIDATE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CANDIDATE_RUN_REGRESSIONS: ${{ inputs.run_regressions }}
          CANDIDATE_RUN_APT_LIFETIME: ${{ inputs.run_apt_lifetime }}
          CANDIDATE_RUN_HUD_REGRESSIONS: ${{ inputs.run_hud_regressions }}
          CANDIDATE_RUN_RESOURCE_REGRESSIONS: ${{ inputs.run_resource_regressions }}
          CANDIDATE_RUN_GUI_IO_REGRESSIONS: ${{ inputs.run_gui_io_regressions }}
          CANDIDATE_RUN_GUI_ANIMATION_REGRESSIONS: ${{ inputs.run_gui_animation_regressions }}
          CANDIDATE_RUN_STARTUP_IO_REGRESSIONS: ${{ inputs.run_startup_io_regressions }}
          CANDIDATE_RUN_GUI_LICENSE_REGRESSIONS: ${{ inputs.run_gui_license_regressions }}
          CANDIDATE_RUN_KEYBOARD_UI_CONTRACT: ${{ inputs.run_keyboard_ui_contract }}
          CANDIDATE_RUN_RWAC_COMMAND_CAPACITY: ${{ inputs.run_rwac_command_capacity }}
          CANDIDATE_RUN_TRAFFIC_FLOWTYPE_OVERRIDE: ${{ inputs.run_traffic_flowtype_override }}
          CANDIDATE_RUN_SYSTEM_USER_PROFILE: ${{ inputs.run_system_user_profile }}
          CANDIDATE_RUN_ONLINE_SAVE_ROUTE: ${{ inputs.run_online_save_route }}
          CANDIDATE_RUN_GUI_MENU_MUSIC_WIRE: ${{ inputs.run_gui_menu_music_wire }}
          GH_TOKEN: ${{ github.token }}
          BRN_EXE_HASH_DEPS: "1"
          BRN_EXE_JOBS: "4"
        run: |
          ./ci/check-candidate-build.ps1 -B5Commit $env:CANDIDATE_B5_SHA `
            -WorkflowSha $env:CANDIDATE_WORKFLOW_SHA -Jobs 4 `
            -RunRegressions:($env:CANDIDATE_RUN_REGRESSIONS -eq 'true') `
            -RunAptLifetime:($env:CANDIDATE_RUN_APT_LIFETIME -eq 'true') `
            -RunHudRegressions:($env:CANDIDATE_RUN_HUD_REGRESSIONS -eq 'true') `
            -RunResourceRegressions:($env:CANDIDATE_RUN_RESOURCE_REGRESSIONS -eq 'true') `
            -RunGuiIORegressions:($env:CANDIDATE_RUN_GUI_IO_REGRESSIONS -eq 'true') `
            -RunGuiAnimationRegressions:($env:CANDIDATE_RUN_GUI_ANIMATION_REGRESSIONS -eq 'true') `
            -RunStartupIORegressions:($env:CANDIDATE_RUN_STARTUP_IO_REGRESSIONS -eq 'true') `
            -RunGuiLicenseRegressions:($env:CANDIDATE_RUN_GUI_LICENSE_REGRESSIONS -eq 'true') `
            -RunKeyboardUIContract:($env:CANDIDATE_RUN_KEYBOARD_UI_CONTRACT -eq 'true') `
            -RunRwacCommandCapacity:($env:CANDIDATE_RUN_RWAC_COMMAND_CAPACITY -eq 'true') `
            -RunSystemUserProfile:($env:CANDIDATE_RUN_SYSTEM_USER_PROFILE -eq 'true') `
            -RunTrafficFlowtypeOverride:($env:CANDIDATE_RUN_TRAFFIC_FLOWTYPE_OVERRIDE -eq 'true') `
            -RunOnlineSaveRoute:($env:CANDIDATE_RUN_ONLINE_SAVE_ROUTE -eq 'true') `
            -RunGuiMenuMusicWire:($env:CANDIDATE_RUN_GUI_MENU_MUSIC_WIRE -eq 'true')

      - name: Check real Windows physical-allocation pair
        timeout-minutes: 15
        shell: pwsh
        env:
          CANDIDATE_B5_SHA: ${{ inputs.b5_commit }}
          CANDIDATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $raw = [IO.File]::ReadAllText((Join-Path $pwd 'b5-decomp/tests/run_low_memory_xphysical_windows.py')).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try { $digest = [Convert]::ToHexString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($raw))).ToLowerInvariant() } finally { $hasher.Dispose() }
          if ($digest -cne '7a057d10c3475dd7729858f727df203c58cae2ae54121e79cc079c16c47cfb11') { throw 'Unexpected Windows allocation runner source.' }
          git -C b5-decomp fetch --recurse-submodules=no --no-tags --depth=1 origin f0b8f37b39b89390f61f1f0264c8b704950fb030
          if ($LASTEXITCODE -ne 0) { throw 'Exact unchanged allocation control is unavailable.' }
          python b5-decomp/tests/run_low_memory_xphysical_windows.py --workflow-root . --out build/candidate/artifacts/low-memory-xphysical --run
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows allocation/free family fixture failed.' }

      - name: Check actual allocator trace reporting
        timeout-minutes: 10
        shell: pwsh
        env:
          CANDIDATE_B5_SHA: ${{ inputs.b5_commit }}
          CANDIDATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $raw = [IO.File]::ReadAllText((Join-Path $pwd 'b5-decomp/tests/run_allocator_heap_report.py')).Replace("`r`n", "`n")
          $hasher = [Security.Cryptography.SHA256]::Create()
          try { $digest = [Convert]::ToHexString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($raw))).ToLowerInvariant() } finally { $hasher.Dispose() }
          if ($digest -cne '29abfebccc0f8a2e0a512ec17bae827e6a2ae66e3601d0e7a5cf9021517445ec') { throw 'Unexpected allocator trace runner source.' }
          git -C b5-decomp fetch --recurse-submodules=no --no-tags --depth=1 origin 5faee8a45c139e076bb0c7578568052026f587f2
          if ($LASTEXITCODE -ne 0) { throw 'Exact unchanged allocator control is unavailable.' }
          python b5-decomp/tests/run_allocator_heap_report.py --out build/candidate/artifacts/allocator-heap-report
          if ($LASTEXITCODE -ne 0) { throw 'Actual allocator trace fixture failed.' }

      - name: Save successful candidate objects
        if: success()
        uses: actions/cache/save@v4
        with:
          path: build/game/obj/tu
          key: ${{ steps.objects.outputs.cache-primary-key }}

      - name: Upload build outputs and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/candidate/artifacts/Burnout_PC.exe
            build/candidate/artifacts/Burnout_PC.map
            build/candidate/artifacts/Burnout_PC.cgsmap
            build/candidate/artifacts/Burnout_PC.exe.provenance.json
            build/candidate/artifacts/*.dll
            build/candidate/artifacts/SDL3-LICENSE.txt
            build/candidate/artifacts/*.log
            build/candidate/artifacts/input-receipt.json
            build/candidate/artifacts/resource-regressions/**
            build/candidate/artifacts/gui-io-regressions/**
            build/candidate/artifacts/gui-animation-regressions/**
            build/candidate/artifacts/startup-io-regressions/**
            build/candidate/artifacts/gui-license-regressions/**
            build/candidate/artifacts/keyboard-ui-contract/**
            build/candidate/artifacts/rwac-capacity/**
            build/candidate/artifacts/hud-regressions/**
            build/candidate/artifacts/system-user-profile/**
            build/candidate/artifacts/traffic-flowtype-override/**
            build/candidate/artifacts/online-save-route/**
            build/candidate/artifacts/gui-menu-music-wire/**
            build/candidate/artifacts/low-memory-xphysical/**
            build/candidate/artifacts/allocator-heap-report/**
          if-no-files-found: error
          retention-days: 1
