name: Reconcile status + submodule pointer

# Every pushed b5 commit is queued. Audit that exact source snapshot, recover
# unambiguous non-stub functions, and reconcile complete named TU sets through the
# admin publisher API. The server preserves claims, compiled work and explicit
# review decisions. Export its resulting durable ledger before publishing.
#
# An hourly freshness check repairs a missed trigger, a failed publication, or
# changed identity/parser inputs. Replays are idempotent and superseded snapshots
# cannot roll the live dashboard back. Builds publish their own executable audit.

on:
  repository_dispatch:
    types: [b5-decomp-push]
  workflow_dispatch:
    inputs:
      b5_sha:
        description: "Full 40-character b5-decomp commit (default: current dev tip)"
        required: false
  schedule:
    - cron: "17 * * * *"  # repair a missed/failed notification; healthy snapshots skip work

# Never let two reconciles race on a push to main.
concurrency:
  group: reconcile-status
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  WORK_SERVER: ${{ vars.WORK_SERVER || 'https://decomp.adriwin.fr/' }}
  B5_REPO: https://github.com/${{ github.repository_owner }}/b5-decomp.git
  B5_BRANCH: dev

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          submodules: false   # we manage the b5-decomp pointer explicitly below
          ref: main           # queued runs must start from the latest published progress

      - name: Check scheduled repair freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          needed = True
          if os.environ['EVENT_NAME'] == 'schedule':
              try:
                  tip = subprocess.check_output(['git', 'ls-remote', os.environ['B5_REPO'], 'refs/heads/dev'], text=True).split()[0]
                  base = os.environ['WORK_SERVER'].rstrip('/')
                  state = json.load(urllib.request.urlopen(base + '/api/source-status', timeout=30))
                  audit = json.load(urllib.request.urlopen(base + '/api/audit/summary', timeout=30))
                  inputs = ('progress/tu_index.json', 'progress/identity.json', 'tools/work/source_status.py',
                            'tools/re/funcaudit.py', 'tools/re/stubaudit.py', 'tools/re/requirements.txt')
                  digest = hashlib.sha256(b''.join(pathlib.Path(p).read_bytes() for p in inputs)).hexdigest()
                  durable = json.load(urllib.request.urlopen(base + '/export/status', timeout=30))
                  committed = json.loads(pathlib.Path('progress/status.json').read_text())
                  needed = state.get('source_commit') != tip or state.get('inputs_hash') != digest or audit.get('funcaudit', {}).get('commit') != tip or durable != committed
              except Exception as exc:
                  print('Freshness check failed; attempting repair:', exc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(needed).lower() + '\n')
          PY

      - name: Set up Python
        if: steps.freshness.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evidence audit parser
        if: steps.freshness.outputs.needed == 'true'
        run: python -m pip install -r tools/re/requirements.txt pytest

      - name: Resolve target b5-decomp commit
        if: steps.freshness.outputs.needed == 'true'
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha || github.event.inputs.b5_sha || '' }}
        run: |
          set -euo pipefail
          SHA="$REQUESTED_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote "$B5_REPO" "refs/heads/$B5_BRANCH" | cut -f1)"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "A full hexadecimal b5-decomp commit is required"; exit 1
          fi
          SHA="${SHA,,}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target b5-decomp commit: $SHA"

      - name: Refresh ledger membership without replaying stale statuses
        if: steps.freshness.outputs.needed == 'true'
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORK_TOKEN" || { echo 'WORK_PUBLISH_TOKEN is required'; exit 1; }
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST -H "X-Work-Token: $WORK_TOKEN" -H "Content-Type: application/json" \
            --data '{"branch":"main","reset":false,"metadata_only":true}' \
            "${WORK_SERVER%/}/admin/sync"

      - name: Advance b5-decomp submodule pointer
        if: steps.freshness.outputs.needed == 'true'
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          # Materialise the submodule at the triggering commit over HTTPS (its .gitmodules
          # URL is SSH; we don't touch it, so no stray diff). A fresh clone is more robust
          # than `submodule update` when the recorded pointer isn't fetchable at depth 1.
          # The contents are needed for the cross-check; `git add` records the new gitlink.
          rm -rf b5-decomp
          # Keep commit ancestry to reject out-of-order snapshots; fetch source
          # blobs only for the actual checkout, not for the whole history.
          git clone --filter=blob:none --no-checkout --branch "$B5_BRANCH" "$B5_REPO" b5-decomp
          git -C b5-decomp fetch origin "$SHA"
          git -C b5-decomp checkout -q "$SHA"
          git add b5-decomp

      - name: Refresh the class -> home-file map
        if: steps.freshness.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # class: TUs carry no path of their own, so without this map the work
          # server synthesises a src/classes/<Class>.cpp that exists nowhere and
          # every one of them drops out of contribution attribution. The map was
          # only ever refreshed by hand, so it went three weeks stale and left
          # 633 finished class TUs -- and their functions -- crediting nobody.
          python tools/work/resolve_class_homes.py --apply

      - name: Run the evidence audits (glue audit + stub inventory)
        if: steps.freshness.outputs.needed == 'true'
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          AUTHOR="$(git -C b5-decomp log -1 --format=%an "$SHA")"
          # No IDA exports on this runner: point the tools at nothing and let the
          # packed feature cache answer every console-side question.
          export BP_IDA_EXPORTS=/nonexistent
          python tools/re/funcaudit.py --all --no-md \
            --cache progress/funcaudit_features.json.gz \
            --out progress/funcaudit \
            --meta "b5_commit=$SHA" --meta "b5_author=$AUTHOR"
          python tools/re/stubaudit.py --no-md \
            --cache progress/funcaudit_features.json.gz \
            --out progress/stubs \
            --meta "b5_commit=$SHA" --meta "b5_author=$AUTHOR"
          python - <<'EOF'
          import json
          fa = json.load(open("progress/funcaudit.json"))
          st = json.load(open("progress/stubs.json"))
          print("funcaudit:", fa["stats"])
          print("stubs:", st["stats"])
          assert fa["stats"]["paired"] > 0, "the glue audit paired nothing -- the PC index or identity.json is broken"
          EOF

      - name: Reconcile source coverage into the live ledger
        if: steps.freshness.outputs.needed == 'true'
        id: source
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pytest tools/re/test_funcaudit.py tools/work/test_source_status.py -q
          python tools/work/source_status.py --server "$WORK_SERVER" --publish

      - name: Export the reconciled durable ledger
        if: steps.freshness.outputs.needed == 'true' && steps.source.outputs.superseded != 'true'
        run: python tools/work/fetch_server_status.py --server "$WORK_SERVER"

      - name: Commit + push if anything changed
        if: steps.freshness.outputs.needed == 'true' && steps.source.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          git config user.name  "bp-reconcile-bot"
          git config user.email "bp-reconcile-bot@users.noreply.github.com"
          SHA="${{ steps.target.outputs.sha }}"
          cat > "$RUNNER_TEMP/reconcile-message.txt" <<EOF
          chore: reconcile source status + audits + b5-decomp pointer to ${SHA:0:12}

          Automatic committed-source evidence and durable ledger export.
          Recovered functions are recorded without inventing review passes.
          EOF
          # Overlay only generated inputs onto the newest parent tree. Builds can
          # publish asm/linked-file results while this job runs; preserve those.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            python tools/work/fetch_server_status.py --server "$WORK_SERVER"
            git read-tree origin/main
            git add progress/status.json progress/class_homes.json progress/funcaudit.json progress/stubs.json progress/source_status.json b5-decomp
            if git diff --cached --quiet origin/main; then
              echo "snapshot already published"; exit 0
            fi
            TREE="$(git write-tree)"
            COMMIT="$(git commit-tree "$TREE" -p origin/main -F "$RUNNER_TEMP/reconcile-message.txt")"
            if git push origin "$COMMIT:refs/heads/main"; then exit 0; fi
            sleep 3
          done
          echo "could not publish after five attempts"; exit 1

      - name: Refresh public dashboard snapshot
        if: steps.freshness.outputs.needed == 'true' && steps.source.outputs.superseded != 'true'
        env:
          # The existing CI publisher credential is an admin worker token, so it
          # is also authorised to call the server's durable, non-reset sync.
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WORK_TOKEN" ]; then
            echo "WORK_PUBLISH_TOKEN is required to refresh the public dashboard."
            exit 1
          fi
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST \
            -H "X-Work-Token: $WORK_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"branch":"main","reset":false,"metadata_only":true}' \
            "${WORK_SERVER%/}/admin/sync"
