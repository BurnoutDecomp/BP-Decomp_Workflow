name: Byte-match summary

# The native Xbox 360 tree is b5-decomp's `x360` branch. Compiling it needs the XDK, which no
# hosted runner may carry. Contributors measure locally: after pushing x360 they run
# `work match refresh --record` with the XDK and push the records to main (the default path).
# This workflow joins the committed records with the x360 head, publishes
# progress/bytematch.json + progress/BYTEMATCH.md in one commit and refreshes the dashboard:
#   - every x360 push (repository_dispatch b5-x360-push) publishes at the new head at once,
#     marking each record whose source changed since it was measured as stale;
#   - the committed-ledger workflow (bytematch-publish.yml) calls it with publish_only when
#     records or ledger inputs reach main.
# The work server's XDK-under-Wine measurement (tools/bytematch/wine.py, adopted by
# tools/bytematch/remote.py) is optional: it runs only on a manual run (workflow_dispatch,
# measure: true) or on the nightly schedule, as an independent cross-check of the
# contributors' records. If the server cannot measure, the summary still publishes.

on:
  repository_dispatch:
    types: [b5-x360-push]
  schedule:
    - cron: "17 3 * * *"   # nightly server cross-check of the x360 tip
  workflow_call:
    inputs:
      publish_only:
        type: boolean
        required: true
    secrets:
      WORK_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      b5_sha:
        description: "Full 40-character x360 commit (default: the current x360 tip)"
        required: false
      measure:
        description: "Measure on the work server (XDK under Wine) before publishing"
        type: boolean
        required: false
        default: true

concurrency:
  # Keep the latest pending run in each group. Publishing runs never wait behind a server
  # measurement; both kinds check out current main.
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.measure && !inputs.publish_only)) && 'bytematch-measure' || 'bytematch-committed-ledger' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORK_SERVER: ${{ vars.WORK_SERVER || 'https://decomp.adriwin.fr/' }}
  B5_REPO: https://github.com/${{ github.repository_owner }}/b5-decomp.git
  B5_BRANCH: x360

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: main   # queued runs start from the newest records

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the ledger tools
        run: |
          python -m pip install pytest
          python -m pytest tools/bytematch/test_bytematch.py tools/bytematch/test_wine.py -q

      - name: Resolve the native branch commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha || github.event.inputs.b5_sha || '' }}
        run: |
          set -euo pipefail
          SHA="$REQUESTED_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote "$B5_REPO" "refs/heads/$B5_BRANCH" | cut -f1)"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "No full commit for b5-decomp $B5_BRANCH (does the branch exist?)"; exit 1
          fi
          SHA="${SHA,,}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Native commit: $SHA"

      - name: Fetch the native tree's commits and trees (no file contents)
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --branch "$B5_BRANCH" "$B5_REPO" b5-x360
          git -C b5-x360 fetch origin "${{ steps.target.outputs.sha }}"

      # Server measurement is opt-in: a manual run (measure: true) or the nightly schedule.
      # x360 pushes and committed-ledger runs publish the contributors' records directly.
      - name: Measure the commit on the work server
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.measure && !inputs.publish_only) }}
        id: measure
        continue-on-error: true    # without the server, the summary still publishes
        timeout-minutes: 300
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          python tools/bytematch/remote.py measure --sha "${{ steps.target.outputs.sha }}" --b5 b5-x360 \
            --changes "$RUNNER_TEMP/bytematch-changes.txt" --deletions "$RUNNER_TEMP/bytematch-deletions.txt"

      # A measurement can take long enough for x360 to move on, and only the tip publishes.
      # Publish at the tip it reached: the summary marks each record whose source changed
      # since it was measured, and the next run measures them.
      - name: Resolve the tip to publish at
        id: tip
        run: |
          set -euo pipefail
          TIP="$(git ls-remote "$B5_REPO" "refs/heads/$B5_BRANCH" | cut -f1)"
          TIP="${TIP,,}"
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "No x360 tip"; exit 1; }
          git -C b5-x360 fetch origin "$TIP"
          echo "sha=$TIP" >> "$GITHUB_OUTPUT"
          echo "Publishing at x360 $TIP (measured ${{ steps.target.outputs.sha }})"

      - name: Build the summary
        run: |
          python tools/bytematch/bytematch.py summary --b5 b5-x360 --head "${{ steps.tip.outputs.sha }}"
          head -c 1200 progress/BYTEMATCH.md

      - name: Commit + push the summary
        id: publish
        run: |
          set -euo pipefail
          git config user.name  "bp-reconcile-bot"
          git config user.email "bp-reconcile-bot@users.noreply.github.com"
          SHA="${{ steps.tip.outputs.sha }}"
          MEASURED="${{ steps.target.outputs.sha }}"
          CHANGED="${{ steps.measure.outputs.records_changed || 0 }}"
          DELETED="${{ steps.measure.outputs.records_deleted || 0 }}"
          if [ "$CHANGED" != 0 ] || [ "$DELETED" != 0 ]; then
            TITLE="progress: byte-match records at x360 ${MEASURED:0:12}"
            BODY="The work server measured x360 ${MEASURED:0:12}: $CHANGED records changed, $DELETED deleted. Summary at ${SHA:0:12}."
          else
            TITLE="chore: byte-match summary at x360 ${SHA:0:12}"
            BODY="Automatic join of the committed byte-match records with the native branch head."
          fi
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/bytematch-message.txt"
          python tools/work/publish_snapshot.py publish \
            --source-repo "$B5_REPO" --source-commit "$SHA" \
            --kind bytematch --message-file "$RUNNER_TEMP/bytematch-message.txt" \
            --result bytematch-publication.json \
            --files progress/bytematch.json progress/BYTEMATCH.md \
            --files-from "$RUNNER_TEMP/bytematch-changes.txt" \
            --delete-from "$RUNNER_TEMP/bytematch-deletions.txt"

      - name: Refresh public dashboard snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORK_TOKEN" || { echo 'WORK_PUBLISH_TOKEN is required'; exit 1; }
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST -H "X-Work-Token: $WORK_TOKEN" -H "Content-Type: application/json" \
            --data '{"branch":"main","reset":false,"metadata_only":true}' \
            "${WORK_SERVER%/}/admin/sync"

      - name: Keep this run's summary and publication decision
        if: always() && steps.target.outputs.sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: bytematch-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: |
            progress/bytematch.json
            progress/BYTEMATCH.md
            bytematch-publication.json
          retention-days: 30
          if-no-files-found: warn
