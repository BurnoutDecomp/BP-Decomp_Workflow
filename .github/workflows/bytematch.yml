name: Byte-match summary

# The native Xbox 360 tree is b5-decomp's `x360` branch. Compiling it needs the XDK,
# which no hosted runner has, so contributors measure it locally and commit per-object
# records under progress/bytematch/ (`work match refresh --record`; byte-match skill).
# This workflow joins those records with the branch head after every native push and
# every record push, publishes progress/bytematch.json + progress/BYTEMATCH.md, and
# refreshes the dashboard. A record whose source changed since it was measured is
# published as stale, never silently kept current.

on:
  repository_dispatch:
    types: [b5-x360-push]
  push:
    branches: [main]
    paths:
      - "progress/bytematch/**"
      - "tools/bytematch/**"
  workflow_dispatch:
    inputs:
      b5_sha:
        description: "Full 40-character x360 commit (default: the current x360 tip)"
        required: false

concurrency:
  group: bytematch-summary
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  WORK_SERVER: ${{ vars.WORK_SERVER || 'https://decomp.adriwin.fr/' }}
  B5_REPO: https://github.com/${{ github.repository_owner }}/b5-decomp.git
  B5_BRANCH: x360

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: main   # queued runs start from the newest records

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the ledger tools
        run: |
          python -m pip install pytest
          python -m pytest tools/bytematch/test_bytematch.py -q

      - name: Resolve the native branch commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha || github.event.inputs.b5_sha || '' }}
        run: |
          set -euo pipefail
          SHA="$REQUESTED_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote "$B5_REPO" "refs/heads/$B5_BRANCH" | cut -f1)"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "No full commit for b5-decomp $B5_BRANCH (does the branch exist?)"; exit 1
          fi
          SHA="${SHA,,}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Native commit: $SHA"

      - name: Fetch the native tree's commits and trees (no file contents)
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --branch "$B5_BRANCH" "$B5_REPO" b5-x360
          git -C b5-x360 fetch origin "${{ steps.target.outputs.sha }}"

      - name: Build the summary
        run: |
          python tools/bytematch/bytematch.py summary --b5 b5-x360 --head "${{ steps.target.outputs.sha }}"
          head -c 1200 progress/BYTEMATCH.md

      - name: Commit + push the summary
        id: publish
        run: |
          set -euo pipefail
          git config user.name  "bp-reconcile-bot"
          git config user.email "bp-reconcile-bot@users.noreply.github.com"
          SHA="${{ steps.target.outputs.sha }}"
          cat > "$RUNNER_TEMP/bytematch-message.txt" <<EOF
          chore: byte-match summary at x360 ${SHA:0:12}

          Automatic join of the committed byte-match records with the native branch head.
          EOF
          python tools/work/publish_snapshot.py publish \
            --source-repo "$B5_REPO" --source-commit "$SHA" \
            --kind bytematch --message-file "$RUNNER_TEMP/bytematch-message.txt" \
            --result bytematch-publication.json \
            --files progress/bytematch.json progress/BYTEMATCH.md

      - name: Refresh public dashboard snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORK_TOKEN" || { echo 'WORK_PUBLISH_TOKEN is required'; exit 1; }
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST -H "X-Work-Token: $WORK_TOKEN" -H "Content-Type: application/json" \
            --data '{"branch":"main","reset":false,"metadata_only":true}' \
            "${WORK_SERVER%/}/admin/sync"

      - name: Keep this run's summary and publication decision
        if: always() && steps.target.outputs.sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: bytematch-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: |
            progress/bytematch.json
            progress/BYTEMATCH.md
            bytematch-publication.json
          retention-days: 30
          if-no-files-found: warn
