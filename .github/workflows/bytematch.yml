name: Byte-match summary

# The native Xbox 360 tree is b5-decomp's `x360` branch. Compiling it needs the XDK,
# which no hosted runner may carry, so the work server measures each native push: it
# compiles what changed with the XDK under Wine in a sandboxed container
# (tools/bytematch/wine.py) and this workflow adopts the records whose result changed
# (tools/bytematch/remote.py). It then joins the records with the branch head, publishes
# them with progress/bytematch.json + progress/BYTEMATCH.md in one commit, and refreshes
# the dashboard. Contributors may still record locally (`work match refresh --record`).
# If the server cannot measure, the summary is published from the committed records,
# and a record whose source changed since it was measured shows as stale.

on:
  repository_dispatch:
    types: [b5-x360-push]
  push:
    branches: [main]
    paths:
      - "progress/bytematch/**"
      - "tools/bytematch/**"
  workflow_dispatch:
    inputs:
      b5_sha:
        description: "Full 40-character x360 commit (default: the current x360 tip)"
        required: false

concurrency:
  group: bytematch-summary
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  WORK_SERVER: ${{ vars.WORK_SERVER || 'https://decomp.adriwin.fr/' }}
  B5_REPO: https://github.com/${{ github.repository_owner }}/b5-decomp.git
  B5_BRANCH: x360

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: main   # queued runs start from the newest records

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test the ledger tools
        run: |
          python -m pip install pytest
          python -m pytest tools/bytematch/test_bytematch.py tools/bytematch/test_wine.py -q

      - name: Resolve the native branch commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.sha || github.event.inputs.b5_sha || '' }}
        run: |
          set -euo pipefail
          SHA="$REQUESTED_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(git ls-remote "$B5_REPO" "refs/heads/$B5_BRANCH" | cut -f1)"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "No full commit for b5-decomp $B5_BRANCH (does the branch exist?)"; exit 1
          fi
          SHA="${SHA,,}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Native commit: $SHA"

      - name: Fetch the native tree's commits and trees (no file contents)
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --branch "$B5_BRANCH" "$B5_REPO" b5-x360
          git -C b5-x360 fetch origin "${{ steps.target.outputs.sha }}"

      - name: Measure the commit on the work server
        id: measure
        continue-on-error: true    # without the server, the summary still publishes
        timeout-minutes: 300
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          python tools/bytematch/remote.py measure --sha "${{ steps.target.outputs.sha }}" \
            --changes "$RUNNER_TEMP/bytematch-changes.txt" --deletions "$RUNNER_TEMP/bytematch-deletions.txt"

      - name: Build the summary
        run: |
          python tools/bytematch/bytematch.py summary --b5 b5-x360 --head "${{ steps.target.outputs.sha }}"
          head -c 1200 progress/BYTEMATCH.md

      - name: Commit + push the summary
        id: publish
        run: |
          set -euo pipefail
          git config user.name  "bp-reconcile-bot"
          git config user.email "bp-reconcile-bot@users.noreply.github.com"
          SHA="${{ steps.target.outputs.sha }}"
          CHANGED="${{ steps.measure.outputs.records_changed || 0 }}"
          DELETED="${{ steps.measure.outputs.records_deleted || 0 }}"
          if [ "$CHANGED" != 0 ] || [ "$DELETED" != 0 ]; then
            TITLE="progress: byte-match records at x360 ${SHA:0:12}"
            BODY="The work server measured the push: $CHANGED records changed, $DELETED deleted, summary rebuilt."
          else
            TITLE="chore: byte-match summary at x360 ${SHA:0:12}"
            BODY="Automatic join of the committed byte-match records with the native branch head."
          fi
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/bytematch-message.txt"
          python tools/work/publish_snapshot.py publish \
            --source-repo "$B5_REPO" --source-commit "$SHA" \
            --kind bytematch --message-file "$RUNNER_TEMP/bytematch-message.txt" \
            --result bytematch-publication.json \
            --files progress/bytematch.json progress/BYTEMATCH.md \
            --files-from "$RUNNER_TEMP/bytematch-changes.txt" \
            --delete-from "$RUNNER_TEMP/bytematch-deletions.txt"

      - name: Refresh public dashboard snapshot
        if: steps.publish.outputs.published == 'true'
        env:
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORK_TOKEN" || { echo 'WORK_PUBLISH_TOKEN is required'; exit 1; }
          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST -H "X-Work-Token: $WORK_TOKEN" -H "Content-Type: application/json" \
            --data '{"branch":"main","reset":false,"metadata_only":true}' \
            "${WORK_SERVER%/}/admin/sync"

      - name: Keep this run's summary and publication decision
        if: always() && steps.target.outputs.sha != ''
        uses: actions/upload-artifact@v4
        with:
          name: bytematch-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: |
            progress/bytematch.json
            progress/BYTEMATCH.md
            bytematch-publication.json
          retention-days: 30
          if-no-files-found: warn
