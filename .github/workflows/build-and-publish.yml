# Build the game exe on every commit and upload it to the work server, which
# merges in the game assets and publishes the download.
#
# Runs on a GITHUB-HOSTED windows-latest runner. That image ships MSVC (VS2022
# Enterprise), MSYS2 at C:\msys64, and Strawberry Perl at C:\Strawberry -- the
# exact toolchain tools\build\build_ffmpeg.bat and build_game_exe.bat expect --
# so the bespoke `cl` build works without a self-hosted box.
#
# CI compiles ONLY the exe (no ~1 GB asset handling): it uploads a small exe
# bundle, and the SERVER rclone-syncs the assets and assembles the served zip.
#
# One repo secret is required (Settings -> Secrets and variables -> Actions):
#   WORK_PUBLISH_TOKEN  admin X-Work-Token minted on the work server
# One variable (already set): WORK_SERVER.
#
# See deploy/ci/README.md in BP-work-server for the full setup.

name: Build & Publish Game

on:
  push:
    branches: [main]
  # A daily run lets the server re-pull Drive assets and republish even when the
  # source is quiet (asset-only changes still reach the download).
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# One build at a time; a newer push supersedes an in-flight build.
concurrency:
  group: build-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # First run compiles FFmpeg (uncached); later runs restore it. Also stops a
    # wedged run from hanging for the default 6h.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Preflight: the FFmpeg build relies on these preinstalled runner tools.
      # Fail early and clearly if the image ever drops them.
      - name: Verify FFmpeg toolchain present
        shell: pwsh
        run: |
          $ok = $true
          foreach ($p in 'C:\msys64\usr\bin\bash.exe','C:\Strawberry\c\bin') {
            if (Test-Path $p) { Write-Host "found $p" }
            else { Write-Warning "MISSING $p"; $ok = $false }
          }
          if (-not $ok) { throw "FFmpeg build prerequisites missing on this runner image" }

      # Build the vendored FFmpeg + Lua once, then reuse. Keyed on the FFmpeg
      # submodule commit + the build scripts, so a dep or recipe change rebuilds.
      - name: Dependency cache key
        id: depkey
        shell: bash
        run: |
          ff=$(git -C b5-decomp/vendor/FFmpeg rev-parse HEAD 2>/dev/null || echo none)
          scripts=$(sha256sum tools/build/build_ffmpeg.bat tools/build/build_ffmpeg.sh tools/build/build_lua.bat | sha256sum | cut -c1-16)
          echo "key=deps-v1-ff-${ff}-${scripts}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg + Lua builds
        uses: actions/cache@v4
        with:
          path: |
            b5-decomp/vendor/ffmpeg-build
            b5-decomp/vendor/lua/lua515.lib
          key: ${{ steps.depkey.outputs.key }}

      - name: Build exe & upload bundle
        shell: pwsh
        env:
          WORK_SERVER: ${{ vars.WORK_SERVER }}          # e.g. https://adriwin.fr
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}  # an admin X-Work-Token
        run: |
          ./ci/publish-build.ps1 `
            -WorkServer $env:WORK_SERVER `
            -WorkToken $env:WORK_TOKEN `
            -CommitSha $env:GITHUB_SHA `
            -Branch $env:GITHUB_REF_NAME
