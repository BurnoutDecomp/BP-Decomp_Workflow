# Build the game exe on a schedule / on demand and upload it to the work server,
# which merges in the game assets and publishes the download.
#
# Runs on a GITHUB-HOSTED windows-latest runner (MSVC via ilammy/msvc-dev-cmd).
# CI compiles ONLY the exe (no ~1 GB asset handling): it uploads a small exe
# bundle, and the SERVER rclone-syncs the assets and assembles the served zip.
#
# FFmpeg is NOT compiled here -- the MSYS2 source build is fragile on CI (a GNU
# Make 4.4 awk-recipe bug). Instead we download a prebuilt copy from the
# "ffmpeg-prebuilt" release. Rebuild + re-upload that asset when the FFmpeg
# submodule changes (see deploy/ci/README.md in BP-work-server).
#
# One repo secret is required: WORK_PUBLISH_TOKEN (admin X-Work-Token from the
# work server). One variable (already set): WORK_SERVER.

name: Build & Publish Game

on:
  # No per-push trigger: main gets frequent automated ledger commits, and a build
  # per push would keep restarting. Build once daily (which also re-pulls the
  # Drive assets server-side) and on demand via "Run workflow" / `gh workflow run`.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (repo only)
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true

      # Init ONLY the submodules the build needs, non-recursively. `recursive`
      # drags in EABase/EASTL's test/packages submodules, which reference each
      # other cyclically and overflow Windows' 260-char path limit. We need
      # b5-decomp + the EA vendor libs; FFmpeg comes prebuilt (below), so its
      # source submodule is skipped.
      - name: Init required submodules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global core.longpaths true
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git submodule update --init b5-decomp
          git -C b5-decomp submodule update --init vendor/EABase vendor/EASTL vendor/EAThread

      # Download the prebuilt FFmpeg (libs + DLLs + headers) into the tree where
      # build_game_exe.bat expects it, instead of compiling FFmpeg from source.
      # Hosted as the "ffmpeg-prebuilt" release on the FFmpeg fork repo (public).
      - name: Fetch prebuilt FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest=b5-decomp/vendor/ffmpeg-build
          mkdir -p "$dest"
          gh release download ffmpeg-prebuilt --repo BurnoutDecomp/FFmpeg-Xenia-new -p ffmpeg-build.zip -O ffmpeg-build.zip
          unzip -q -o ffmpeg-build.zip -d "$dest"
          test -f "$dest/bin/avcodec.lib" || { echo "prebuilt FFmpeg missing bin/avcodec.lib"; exit 1; }

      # Put MSVC (cl) on PATH so the build .bat files skip their own fragile
      # `call vcvars64 >nul 2>&1` (which died silently with exit 255 on the runner).
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build exe & upload bundle
        shell: pwsh
        env:
          WORK_SERVER: ${{ vars.WORK_SERVER }}          # e.g. https://decomp.adriwin.fr
          WORK_TOKEN: ${{ secrets.WORK_PUBLISH_TOKEN }}  # an admin X-Work-Token
        run: |
          ./ci/publish-build.ps1 `
            -WorkServer $env:WORK_SERVER `
            -WorkToken $env:WORK_TOKEN `
            -CommitSha $env:GITHUB_SHA `
            -Branch $env:GITHUB_REF_NAME
