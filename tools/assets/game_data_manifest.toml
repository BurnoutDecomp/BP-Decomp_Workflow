#  game_data_manifest.toml -- source path pattern  ->  action, for the whole retail
#  X360 game folder.  Read by tools/assets/build_game_data.py (see that file's module
#  docstring for the actions, the placeholders, and how a rule is executed).
#
#  ORDER MATTERS: the FIRST rule whose `match` accepts a file wins.  A file that
#  matches nothing falls through to the built-in catch-all and is reported UNHANDLED.
#
#  Every rule carries `why` -- the evidence the rule rests on.  The house style in this
#  repo is that a constant without provenance is a guess; the same applies to a mapping.
#  When you add a converter, edit THIS FILE, not the orchestrator.
#
#  ACTIONS
#    convert    run `py <tool> <argv...>`; the product must satisfy `verify`
#    copy       byte-for-byte copy (only legitimate when the file needs NO change)
#    skip       deliberately not shipped
#    generate   produce a file that has no 1:1 source (schema.vlt/bin, loading screens)
#    unhandled  needs conversion, has no converter -- REQUIRES `reason`
#
#  PLACEHOLDERS in `argv` / `produces` / `out_name`
#    {src} {out} {srcdir} {outdir} {name} {stem} {ext} {src_rel} {out_rel}
#    {tok0} {tok1} ...   underscore-split tokens of {stem}  (VEH_PUSMC01_AT -> tok1=PUSMC01)
#    {workroot}          the private mirrored repo root this invocation runs in
#
#  VERIFY expressions (checked against the produced file; a failure is a FAILURE, and
#  the half-written output is deleted so a re-run retries it)
#    bnd2_platform=N   nonempty   min_size=N   magic=<ascii or 0x hex>
#
#  ⚠️  A `copy` rule on a file whose first four bytes are `bnd2` with platform 2 is a
#  manifest BUG -- the orchestrator flags it loudly in --dry-run.  X360 platform-2
#  containers are inert to the reconstructed BundleLoader, which hard-requires
#  platform 4 (tools/assets/bundles/convert_x360_bundle.py module docstring).

schema_version = 1


# ---------------------------------------------------------------------------------
# 0.  Things that must never reach the game folder
# ---------------------------------------------------------------------------------

[[rule]]
id     = "skip-x360-executables"
match  = ["*.XEX", "*.XDB"]
action = "skip"
why    = """The Xbox 360 executables and their debug databases. The PC build ships
Burnout_PC.exe instead (tools/build/build_game_exe.bat). BURNOUT_X360_ARTIST.XEX is
still USED by this tool -- see the loadingscreen generate rule -- but as an input, not
as a shipped file."""

[[rule]]
id     = "skip-console-caches"
match  = ["files.bmcache", "*/files.bmcache", "XBOXMEM.MEM", "$SYSTEMUPDATE/*"]
action = "skip"
why    = """`files.bmcache` is the console bundle-manager's on-disc file cache,
XBOXMEM.MEM is a memory dump, and $SYSTEMUPDATE is the Xbox 360 title update payload.
None is read by the reconstructed loader."""

[[rule]]
id     = "skip-vehicle-readme"
match  = ["VEHICLES/do not share originals.txt"]
action = "skip"
why    = "A zero-byte marker file left in the rip. Not game data."


# ---------------------------------------------------------------------------------
# 1.  Generated -- no 1:1 source file exists
# ---------------------------------------------------------------------------------

[[rule]]
id       = "generate-attribsys-schema"
action   = "generate"
tool     = "bundles/attribsys_schema_port.py"
argv     = ["{repo}/build/game_x360_world/SCHEMA_VLT_BE.bin",
            "{repo}/build/game_x360_world/SCHEMA_BIN_BE.bin",
            "{outdir}"]
outputs  = ["schema.vlt", "schema.bin"]
inputs   = ["{repo}/build/game_x360_world/SCHEMA_VLT_BE.bin",
            "{repo}/build/game_x360_world/SCHEMA_BIN_BE.bin"]
verify   = ["nonempty"]
why      = """The AttribSys schema is NOT shipped as a resource -- the X360 exe bakes the
serialised pair in .rdata and registers it in GameDataModule::PrepareAttribSysSchemaResource
@0x82673258 (vlt @0x82CD3D88 size 5664, bin @0x82CD53B0 size 20352).  The big-endian
payloads were chiselled out with headless IDA into build/game_x360_world/SCHEMA_*_BE.bin;
attribsys_schema_port.py ports them to the loose LE schema.vlt/schema.bin the runtime opens.
See the module docstring of attribsys_schema_port.py."""

[[rule]]
id       = "generate-loadingscreen"
action   = "generate"
tool     = "textures/extract_xex.py"
argv     = []
cwd      = "{workroot}"
stage_in = [["BURNOUT_X360_ARTIST.XEX", "references/artist.xex"]]
produces_dir = "build/loadingscreen"
out_subdir   = "LOADINGSCREEN"
verify   = ["nonempty"]
why      = """The four boot loading-screen textures live in the ARTIST XEX's .rdata, not in
any bundle (addresses/sizes from LoadingScreenRenderer::Construct @0x823CE208).
tools/assets/textures/extract_xex.py untiles + DXT5-decodes them into the A8R8G8B8 .dds
the PC loader's LoadFromDDS reads.  It has hardcoded relative paths
(`references/artist.xex` -> `build/loadingscreen`) and no CLI, so the orchestrator stages
the XEX into the worker root under that name and runs it with cwd=<workroot>."""


# ---------------------------------------------------------------------------------
# 2.  World / streaming data
# ---------------------------------------------------------------------------------

[[rule]]
id      = "world-units"
match   = ["TRK_UNIT*_GR.BNDL", "GLOBALBACKDROPS.BNDL", "WORLDTEX.BIN", "GLOBALPROPS.BIN"]
action  = "convert"
tool    = "bundles/convert_world_bundle.py"
argv    = ["{src}", "{out}"]
verify  = ["bnd2_platform=4"]
isolate = "volatility"
why     = """convert_world_bundle.py's docstring names exactly this set ("TRK_UNIT<N>_GR.BNDL,
GLOBALBACKDROPS, WORLDTEX..."), and batch_convert_world.py's own file list is
TRK_UNIT*_GR.BNDL + GLOBALBACKDROPS.BNDL + GLOBALPROPS.BIN.  It shells out to Volatility,
which stores imported resources in an exe-adjacent data dir, so parallel workers must not
share one -- hence isolate="volatility" (the same workaround batch_convert_world._worker_init
applies)."""

[[rule]]
id     = "world-support"
match  = ["PVS.BNDL", "WORLDCOL.BIN"]
action = "convert"
tool   = "bundles/world_support_transcode.py"
argv   = ["--bundle", "{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """world_support_transcode.py docstring: PVS.BNDL = ZoneList (type 0xB000),
WORLDCOL.BIN = PolygonSoupList (0x43) + IdList (0x25).  All three have committed PC
consumers with real widened pointer members, so this is a widening rebuild, not a flip."""

[[rule]]
id     = "lane-data"
match  = ["B5TRAFFIC.BNDL", "AI.DAT", "TRIGGERS.DAT"]
action = "convert"
tool   = "bundles/lane_transcode.py"
argv   = ["--bundle", "{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """lane_transcode.py docstring names these three by name and by resource type:
BrnTraffic::TrafficData (0x10002), BrnAI::AISectionsData (0x10001),
BrnTrigger::TriggerData (0x10003)."""

[[rule]]
id     = "attribsys-vaults"
match  = ["WORLDVAULT.BIN", "SURFACELIST.BIN", "CAMERAS.BUNDLE", "DISTRICTS.DAT"]
action = "convert"
tool   = "bundles/attribsys_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """attribsys_transcode.py docstring names all four with their resource ids
(WORLDVAULT rid 7CD1FBEE, SURFACELIST rid 43096C31, CAMERAS.BUNDLE rid 28FE4576 the
CameraVault, DISTRICTS.DAT rid 68E318DC WorldPainter2D).  CAMERAS.BUNDLE additionally
delegates its ICETakeDictionary to the ice_transcode rebuilder."""


# ---------------------------------------------------------------------------------
# 3.  Textures / GUI banks / HUD
# ---------------------------------------------------------------------------------

[[rule]]
id     = "texture-bundles"
match  = ["GUITEXTURES.BIN", "SMALL8X8WHITESQUARE.BUNDLE",
          "GLOBALTEXTUREDICTIONARY.BIN", "MASSIVETEXTUREDICTIONARY.BIN"]
action = "convert"
tool   = "bundles/convert_texture_bundle.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """convert_texture_bundle.py handles "a stock X360 texture-only bundle
(GUITEXTURES.BIN, SMALL8X8WHITESQUARE.BUNDLE, ...)".  The two texture DICTIONARIES are
listed here because build/game holds both at platform 4 at ~1.7x the source size, the
signature of the same Volatility pixel port + x64 header transcode; if a dictionary turns
out to carry a non-Texture resource the verify step will fail it rather than let it pass."""

[[rule]]
id     = "gui-banks"
match  = ["POPUPS.PUP", "HUDMESSAGES.HM", "HUDMESSAGESEQUENCES.HMSC"]
action = "convert"
tool   = "bundles/convert_gui_banks.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """convert_gui_banks.py docstring names exactly these three (GuiPopup 0x1F,
HudMessage 0x2C, HudMessageSequence 0x2E) with their committed PC readers."""

[[rule]]
id     = "flapt-hud"
match  = ["FLAPTHUD.BUNDLE", "FLAPTHUDSD.BUNDLE"]
action = "convert"
tool   = "bundles/convert_flapt_bundle.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """convert_flapt_bundle.py docstring: "a stock X360 Flapt HUD bundle
(FLAPTHUD.BUNDLE / FLAPTHUDSD.BUNDLE: 33 Texture resources + 1 FlaptFile 0x10020)"."""

[[rule]]
id     = "shaders"
match  = ["SHADERS.BNDL"]
action = "convert"
tool   = "shaders/convert_shaders_bundle.py"
argv    = ["convert", "{src}", "{out}", "--fallback"]
verify  = ["bnd2_platform=4"]
isolate = "volatility"
why     = """convert_shaders_bundle.py is the only tool for SHADERS.BNDL and takes an
explicit `convert <in> <out>` subcommand.  Default --mode d3d9 recompiles every
ShaderProgramBuffer from the TUB HLSL with fxc.
⚠️ `--fallback` IS A DELIBERATE DEGRADATION and is on because without it the whole bundle
is unproducible: MEASURED 2026-08-02, a strict run hard-fails with `no TUB HLSL source for
2 technique(s)` (the Vehicle_* set), so tools/assets/shaders/fallback_world.fx is
substituted for those two techniques.  Everything else is really recompiled.
Prerequisites this rule does NOT provide: fxc.exe (env PC_FXC or a Win10/11 SDK) and the
TUB HLSL tree at D:\\Reverse\\nushaders\\Reference\\TUB\\... -- a separate repo.  It also
uses the Volatility texture flow, hence isolate."""


# ---------------------------------------------------------------------------------
# 4.  Vehicles / wheels / engines
# ---------------------------------------------------------------------------------

[[rule]]
id     = "skip-orphan-pddk01xs-attrib"
match  = ["VEHICLES/VEH_PDDK01XS_AT.BIN"]
action = "skip"
why    = """This one orphan bundle contains VehicleAnimation (0x10023) and
BodypartRemapData (0x10024), but PDDK01XS has no VehicleList entry and no reconstructed
consumer requests it. vehicledeform_transcode.py deliberately refuses it by name rather
than emitting guessed native layouts. Omit the unreachable disc orphan from the PC folder."""

[[rule]]
id       = "vehicle-graphics"
match    = ["VEHICLES/VEH_*_GR.BIN"]
action   = "convert"
tool     = "bundles/vehicle_transcode.py"
argv     = ["--car-gr", "{tok1}"]
produces = "build/game/VEHICLES/{name}"
verify   = ["bnd2_platform=4"]
isolate  = "volatility"
why      = """MEASURED, not assumed: the bare 2-positional `<in> <out>` form REFUSES a
graphics bundle -- `no porter for Material x17, MaterialState x4, MaterialTechnique x66,
Model x4, Renderable x8, Texture x10, TextureState x21, VertexDescriptor x4. Refusing to
emit a half-converted bundle` (run against VEH_PSPCHRO_GR.BIN, 2026-08-02).  Those are
WORLD types.  `--car-gr <CODE>` is the real path: _port_graphics_bundle() registers the
GraphicsSpec/WheelGraphicsSpec/GraphicsStub porters into convert_world_bundle.FLIP_PORTABLE
and reuses the world pipeline, then refuses if anything is left big-endian.  It writes to
<ROOT>/build/game/VEHICLES with no override, which under the mirrored worker root is
{workroot}/build/game/VEHICLES -- collected via `produces`.  Reuses convert_world_bundle,
hence isolate="volatility".

TRAFFIC CARS (2026-08-02).  This one rule covers all 430 VEH_*_GR.BIN, and it deliberately
stays one rule -- the 42 T-prefixed (traffic) bundles are NOT a separate pipeline, they just
carry one extra resource type.  Until now they were the tool's largest single failure class:
42 of the 46 whole-run failures, every one of them
    `unknown resource type folder GraphicsStub (passthrough)` ->
    `{'GraphicsStub': 1} left BIG-ENDIAN. Refusing to claim a ported bundle ...`
VERIFIED by two independent readers (YAP, and a from-scratch bnd2+zlib parser) over all 568
retail graphics bundles: exactly 42 carry a BrnTraffic::GraphicsStub (type 65557 / 0x10015,
the name burnout.wiki gives that id), and they are exactly the 42 T-prefixed VEH_*_GR.BIN --
no P (225), X (157), C (6) or WHE_ bundle has one.  vehicle_transcode.py now ports the type;
read its GraphicsStub section for why the correct port is "swap nothing" and for the
per-slot contest against the shipped little-endian BPR Remaster oracle (VERBATIM 42/42,
byte-swap 0/42).  The traffic cars are the only consumers of this type, so this closes it."""

[[rule]]
id       = "vehicle-attrib-deform"
match    = ["VEHICLES/VEH_*_AT.BIN"]
action   = "convert"
tool     = "bundles/vehicledeform_transcode.py"
argv     = ["--stage", "{tok1}"]
produces = "build/game/VEHICLES/{name}"
verify   = ["bnd2_platform=4"]
why      = """VEH_<code>_AT.BIN carries TWO resource types -- 28 AttribSysVault (the
physics/handling tune) and 65564 StreamedDeformationSpec.  vehicleattrib_transcode.py
deliberately REFUSES to write a bundle (half-converted-bundle failure mode);
vehicledeform_transcode.py ports the second half and owns the write path, but only
through `--stage <CARCODE>`, which writes to VEH_DST = <ROOT>/build/game/VEHICLES with no
override.  Because the orchestrator runs every tool from a MIRRORED worker root, that
<ROOT> is the worker root -- so the file lands at {workroot}/build/game/VEHICLES/<name>
and is collected from there via `produces`.  The real build/game is unreachable.
⚠️ vehicledeform_transcode prints a FIXUP_WIDTH_WARNING: format-level result only; the
b5-decomp FixUp still reads these slots at the wrong width."""

[[rule]]
id     = "vehicle-textures"
match  = ["VEHICLES/VEHICLETEX.BIN"]
action = "convert"
tool   = "bundles/vehicletex_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """vehicletex_transcode.py exists specifically for VEHICLETEX.BIN (49 type-0
Texture resources) and documents a bare `<in> <out>` mode in its Usage block."""

[[rule]]
id     = "vehicle-wheel-lists"
match  = ["VEHICLES/VEHICLELIST.BUNDLE", "VEHICLES/VEHICLELIST_V1.BUNDLE",
          "WHEELS/WHEELLIST.BUNDLE"]
action = "convert"
tool   = "bundles/vehicle_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """vehicle_transcode.py --lists is the documented path for VEHICLELIST + WHEELLIST
but writes into build/game; the same convert() is reachable through the 2-positional form,
which is what is used here."""

[[rule]]
id       = "wheel-graphics"
match    = ["WHEELS/WHE_*_GR.BNDL"]
action   = "convert"
tool     = "bundles/vehicle_transcode.py"
argv     = ["--wheel-gr", "{tok1}"]
produces = "build/game/WHEELS/{name}"
verify   = ["bnd2_platform=4"]
isolate  = "volatility"
why      = """Same _port_graphics_bundle path as the car graphics, and the bare 2-positional
form fails the same way (MEASURED against WHE_52120650_GR.BNDL).
✅ The old KNOWN LIMITATION here is FIXED (2026-08-02).  `--wheel-gr` used to take the code
verbatim only when it was all digits and otherwise ran wheel_code_from_name(), which demands
four numeric fields -- so the two alphanumeric TRAFFIC wheels were rejected with
`wheel name 'TW01800' does not have the four numeric fields the WHE_ filename is built from`.
(The old note here named WHE_TW04800F; the retail pair is actually WHE_TW01800_GR.BNDL and
WHE_TW01800F_GR.BNDL -- there is no TW04800F on disc.)  The argument is now resolved by
wheel_bundle_code(), which decides by EXISTENCE of WHE_<arg>_GR.BNDL rather than by the shape
of the string.  This was only ever a filename parse: MEASURED, all 138 retail WHE_*_GR.BNDL
carry the identical resource-type set [0,1,10,12,13,14,15,42,65546], the two traffic wheels
included, so no porter was ever missing.  138 of 138 now convert."""

[[rule]]
id     = "engines"
match  = ["ENGINES/*.BUNDLE"]
action = "convert"
tool   = "bundles/engine_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """engine_transcode.py ports the 149 hash-named per-car engine/exhaust audio
bundles.  Its main() falls through to `convert(argv[1], argv[2])` for a bare 2-positional
call; --all writes into build/game and is never used.  NB --all also drops a `.x360`
sidecar beside each output (keep_x360_copy); the per-file path does not, and the
orchestrator sweeps any *.x360 out of the game folder regardless."""


# ---------------------------------------------------------------------------------
# 5.  Environment / misc single bundles
# ---------------------------------------------------------------------------------

[[rule]]
id     = "environment-colour-cubes"
match  = ["ENVIRONMENTSETTINGS/COLOURCUBES/*.BUNDLE"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """These nested bundles contain ColourCube (type 0x2b), not the
Keyframe/TimeLine/Dictionary resources handled by env_transcode.py.  The schema is a u32
edge length followed by byte-valued RGB cube data, so nonapt_transcode swaps the length and
preserves the colour bytes.  The known-good PC PARADISE_INGAME_JUNK bundle confirms this
separate resource family."""

[[rule]]
id     = "environment-settings"
match  = ["ENVIRONMENTSETTINGS/*.BUNDLE", "ENVIRONMENTSETTINGS/*/*.BUNDLE"]
action = "convert"
tool   = "bundles/env_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """env_transcode.py exists because the generic container convert leaves the env
keyframes big-endian and inert ("that is the data half of 'the sky is black'").  It has a
2-positional `<in> <out>` mode; --all rewrites build/game/ENVIRONMENTSETTINGS in place and
leaves .x360 backups, so it is never used."""

[[rule]]
id     = "environment-lighting-text"
match  = ["ENVIRONMENTSETTINGS/*.DAT"]
action = "copy"
why    = """JUNKYARDLIGHTING.DAT is a plain ASCII file (first bytes `# Ju`), not a bnd2
container -- nothing to endian-flip.  build/game holds it byte-identical (738 bytes)."""

[[rule]]
id     = "video-list"
match  = ["VIDEOS/VIDEOLIST.BUNDLE"]
action = "convert"
tool   = "bundles/videolist_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """The five type-0x42 payloads contain six 12-byte X360 VideoFile records with
big-endian 32-bit self-relative name pointers. The x64 runtime needs 16-byte records with
little-endian 64-bit self-relative pointers; a container-only conversion leaves corrupt
pointers and crashes MovieManager::QueueNextMovie."""


# ---------------------------------------------------------------------------------
# 6.  Verbatim -- genuinely needs no conversion
# ---------------------------------------------------------------------------------

[[rule]]
id     = "videos"
match  = ["VIDEOS/*.VP6"]
action = "copy"
why    = """The movie player decodes the ORIGINAL X360 3-strip VP6 in-code
(CgsMoviePlayer 3-strip recombine, commit 6026e55a); tools/assets/videos/
transcode_x360_video.ps1 was DEPRECATED on 2026-07-13 with the note "put the original
.vp6 in build/game/VIDEOS and the game reads them faithfully".  build/game's five .VP6
are byte-size-identical to the retail originals."""

[[rule]]
id     = "videos-mp4-duplicates"
match  = ["VIDEOS/*.mp4"]
action = "skip"
why    = """The retail folder ships both `INTRO.VP6` and `INTRO.mp4` for each movie.  The
loader requests the .VP6 names (VIDEOLIST) and build/game contains only the five .VP6 --
no .mp4.  541.9 MB of duplicate media; skipped rather than copied."""

[[rule]]
id     = "sound-streams"
match  = ["SOUND/STREAMS/*.SNS"]
action = "copy"
why    = """.SNS are raw XMA stream containers, decoded in-engine
(tools/audio/sns_xma_decode.cpp) -- no container to re-platform.  VERIFIED: the .SNS in
build/game/SOUND/STREAMS are byte-size-identical to the retail originals (spot-checked
00RACE_END_RANK_01/02/03)."""

[[rule]]
id     = "map-files"
match  = ["MAP_*.BIN"]
action = "copy"
why    = """MAP_ARTIST/EXTERNAL/INTERNAL.BIN are CgsMapFile symbol maps, not bnd2
containers (magic 00 00 7E 99).  build/game holds all three byte-identical, with their
original 2008 timestamps -- never touched by any wave."""

[[rule]]
id     = "skip-console-memcard-image"
match  = ["MEMCARD/*.PNG"]
action = "skip"
why    = """Console save-container artwork. The PC profile backend does not consume it,
and SaveLoadSystem currently uses Memcard/SaveImage.png as its console content-info probe:
shipping the file enters the unavailable Realmc callback path instead of the PC no-save path."""


# ---------------------------------------------------------------------------------
# 7.  Additional non-Apt resource families
# ---------------------------------------------------------------------------------

[[rule]]
id       = "fsm-lua"
match    = ["FSM/*.DAT"]
action   = "convert"
tool     = "bundles/nonapt_transcode.py"
argv     = ["{src}", "{out}"]
out_name = "{stem}.BUNDLE"
verify   = ["bnd2_platform=4"]
why      = """FSM resources are BinaryFileResource-wrapped Lua blobs.  The payload body is
opaque Lua data and remains byte-identical; only the native-endian size/offset header is
flipped.  The converter was differentially checked against the curated platform-4 FSM set
(BRNSCREENFSM payload byte-identical) and performs the retail .DAT -> runtime .BUNDLE rename."""

[[rule]]
id     = "language-banks"
match  = ["LANGUAGE/*.BUNDLE"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """LanguageResource is relaid from its BE u32 header and 8-byte entries to the
decomp's LE x64 header and 16-byte entries; string offsets widen to u64 and each UTF-8 string
is padded to the runtime's 8-byte alignment.  The result for retail 0001.BUNDLE is byte-for-byte
identical to the independently produced platform-4 payload."""

[[rule]]
id      = "language-fonts"
match   = ["LANGUAGE/FONTS/*.FONT", "LANGUAGE/FONTSSD/*.FONT"]
action  = "convert"
tool    = "bundles/nonapt_transcode.py"
argv    = ["{src}", "{out}"]
verify  = ["bnd2_platform=4"]
isolate = "volatility"
why     = """The bundle driver combines the existing Font u32->u64 relayout with the proven
Xenos texture detile/endian porter, moves the atlas import to the widened page-pointer array,
and repacks both resources as platform 4.  Font height/name offsets are taken from the ARTIST
retail bytes and the native-x64 struct schema, not the older four-byte-shifted conversion."""

[[rule]]
id     = "sound-pc-direct-big-endian"
match  = ["SOUND/BURNOUTGLOBALDATA.BIN", "SOUND/SPLICER/PRESENTATIONASSET.BUNDLE",
          "SOUND/STREAMS/STREAMHEADERS*.BUNDLE", "SOUND/STREAMS/STREAMSREGISTRY*.BUNDLE"]
action = "copy"
verify = ["bnd2_platform=2", "nonempty"]
why    = """These two files are deliberately consumed outside BundleLoader by the current
PC audio bridges (CgsGuiSoundPC.cpp and CgsStreamHeadersPC.cpp). They read the original X360
bnd2 headers, registry records, Splicer tables, and embedded SNR images with explicit
Be16/Be32/Be64 accessors. Converting these inputs to platform 4 breaks those direct reads;
omitting BURNOUTGLOBALDATA disables the presentation-action mapping. Keep them byte-identical
and verify platform 2.
This is a PC-platform serialized-data leaf, not an unconverted BundleLoader input."""

[[rule]]
id     = "sound-proven-binary-resources"
match  = ["SOUND/GLOBALWAVES.BUNDLE", "SOUND/SPLICER/*.BUNDLE",
          "SOUND/WORLD/EMITTERS.BUNDLE"]
action = "convert"
tool   = "bundles/engine_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """These bundles contain only resource types already covered and validated by
engine_transcode.py: GenericRwacWaveContent, Splicer, and ContentSpec-only Registry.  The driver
is strict and refuses an unexpected type or Registry entity subclass, so this cannot silently
emit a half-converted sound bank."""

[[rule]]
id     = "sound-worldpainter-regions"
match  = ["SOUND/REGIONS/AMBIENCES.DAT"]
action = "convert"
tool   = "bundles/attribsys_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """Despite its path, this is not an audio-middleware bank: it contains one
WorldPainter2D resource. attribsys_transcode.py has a strict schema walk for its BinaryFile
header, u16 dimensions, and byte-valued map, including LE re-walk and byte-exact round trip."""

[[rule]]
id      = "sound-nicotine-snapshots"
match   = ["SOUND/NICOTINEASSET*.BUNDLE"]
action  = "convert"
tool    = "bundles/nonapt_transcode.py"
argv    = ["{src}", "{out}"]
verify  = ["bnd2_platform=4"]
isolate = "volatility"
why     = """Nicotine's mix-map body is a documented all-dword format; the porter
validates the map/state table and every section offset before endian-mapping it with a
byte-exact reverse round trip. SnapshotData uses Volatility's native X360 importer and TUB
exporter, which rebuilds its platform-specific header/status table instead of blanket-swapping."""

[[rule]]
id     = "progression-data"
match  = ["PROGRESSION.DAT", "BTTPROGRESSION.DAT"]
action = "convert"
tool   = "bundles/progression_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """progression_transcode.py is the dedicated, schema-walked type-65550 porter for
both retail progression resources.  It rebuilds the platform-4 container and validates every
array, record stride, pointer, and mixed-endian balance field."""

[[rule]]
id     = "postfx-struct-data"
match  = ["POSTFX/COLOURCUBEDICTIONARY.BIN", "POSTFX/PFXHOOKS.PFX"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """ColourCube is a u32 edge length followed by 3*N^3 byte-valued RGB data.
PFXHookBundle is schema-walked through its hook/group pointer tables, hook records, node tables,
and 0xc0 PFXGroup records; ASCII ids, bools, and padding remain byte-identical."""

[[rule]]
id     = "online-challenges"
match  = ["ONLINECHALLENGES.BNDL"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """The type-65567 payload is a 16-byte header followed by fixed 0xd8
ChallengeListEntry records.  The porter swaps the documented CgsID, target, time, and prop
fields while preserving byte enums, ASCII string ids, and padding."""

[[rule]]
id     = "massive-lookup-table"
match  = ["MASSIVETABLE.BIN"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """MassiveLookupTable is a 16-byte header plus fixed 64-byte items. The native
x64 layout retains that stride but moves/widens the subscriber pointer; vectors, CgsID, and
the item index are endian-mapped from the documented DecFIGS structure."""

[[rule]]
id     = "street-data"
match  = ["STREETDATA.DAT"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """Version-5 StreetData is schema-walked and RELAID OUT to the native x64 image:
header 36 -> 56 bytes, Junction 36 -> 48, Road 64 -> 72, with every serialized u32 offset
slot widened to u64 (Street 16 and ChallengeParScoresEntry 40 are pointer-free and keep
their strides). The blob is consumed in place -- it *is* the BrnStreetData::StreetData
object, and StreetData::FixUp only adds the resource load base to those slots -- so it must
carry the layout the host compiler gives that class. Keeping the console's compact 32-bit
layout put miRoadCount at +0x20 where the x64 loader reads +0x30, which is street[0]: that
is what fired "The number of roads in the design data doesn't match the code const" on boot
(2026-08-11). BrnStreetData.h::_AssertLayout() pins the C++ side of this wire contract."""

[[rule]]
id     = "skip-disabled-profile-upgrade"
match  = ["PROFILEUPG.BIN"]
action = "skip"
why    = """The reconstructed PC path explicitly disables ProfileUpgradeFeatureIsEnabled;
BrnGuiProfile.cpp documents PROFILEUPG as an optional X360-only upgrade table. It is not loaded
on PC and therefore is deliberately omitted rather than counted as missing runtime data."""


# ---------------------------------------------------------------------------------
# 8.  UNHANDLED -- needs conversion, has no converter.  THE POINT OF THIS FILE.
#     Every entry states WHY, so the next agent can attack the right thing.
# ---------------------------------------------------------------------------------

[[rule]]
id     = "skip-guiapt-this-pass"
match  = ["GUIAPT/*.BUNDLE", "GUIAPTSD/*.BUNDLE"]
action = "skip"
why    = """Explicitly excluded from this build pass. No big-endian -> little-endian AptData
(type 0x1E) porter exists in this repo.
apt_widen_4to8.py widens 1:7:4 -> 1:7:8 but asserts `version == 2 and platform == 4`
(apt_widen_4to8.py:735) and reads every field little-endian, so it cannot consume the
platform-2 big-endian console set.  convert_x360_bundle.py's docstring is explicit that
AptData "has no porter yet" and is "passed through verbatim ... X360 big-endian, so they
are inert".  The platform-4 `Apt Data:1:7:8` bundles in build/game/GUIAPT came from
JeBobs' external GUIAPT64 emitter, then apt8_repair.py.  584 files / 99.7 MB.
TO CLOSE THIS: either a BE->LE 1:7:4 transcoder feeding apt_widen_4to8.py, or keep
sourcing the emitter output and run apt8_repair.py on FRESH copies (the retired
apt8_fix_df2_argtab.py pass is destructive and its output cannot be re-repaired)."""

[[rule]]
id     = "unhandled-sound-bundles"
match  = ["SOUND/*.BIN", "SOUND/*.BUNDLE", "SOUND/*/*.BUNDLE", "SOUND/*/*.DAT"]
action = "unhandled"
reason = """No sound-bundle porter.  These are bnd2 platform-2 containers containing AEMS
and mixed-entity Registry middleware images.  The generic wave/Splicer/ContentSpec-only
Registry files are covered by the earlier strict rule, while BURNOUTGLOBALDATA and the
presentation splice bank are deliberately copied for their direct big-endian PC consumer.
These remaining resources contain compiled AEMS/CSIS middleware images or non-ContentSpec
Registry subclasses. Relabelling their containers while preserving BE payloads would be
corrupt, so they remain explicit blockers."""

[[rule]]
id     = "unhandled-postfx"
match  = ["POSTFX/POSTFXVAULT.BIN"]
action = "unhandled"
reason = """COLOURCUBEDICTIONARY.BIN, PFXHOOKS.PFX and POSTFXVAULT.BIN are all bnd2
platform 2 in retail. ColourCube and PFXHookBundle are handled by the schema-walked rule
above. POSTFXVAULT is the sole remaining file: its AttribSys PtrN graph differs from the
vehicle/engine vault schemas, and the strict generic converter rejects it rather than
silently swapping the wrong pointer-selected block."""

[[rule]]
id     = "prop-physics"
match  = ["PROPS/PROPPHYSICS.BUNDLE"]
action = "convert"
tool   = "bundles/nonapt_transcode.py"
argv   = ["{src}", "{out}"]
verify = ["bnd2_platform=4"]
why    = """The game's ONE PropPhysics resource (0xD75C5932, type 0x1000F): the prop TYPE
table that every prop spawn resolves through -- without it PropPhysicsDataHeader::GetType
has nothing to return and no prop can be created. Consumed IN PLACE (the blob *is* the
BrnPhysics::Props::PropPhysicsDataHeader object; FixUp only adds the resource load base to
each serialised offset slot), so it must carry the host layout, exactly like STREETDATA.DAT.
The three fixed pointer tables widen 4 -> 8 (header 0x2C94 -> 0x5818; mapPropTypes[500]
stays at +0x10, mapPropPartTypes[300] moves 0x7E0 -> 0xFB0, mapVolumeTypes[2048]
0xC90 -> 0x1810, muTimeStamp 0x2C90 -> 0x5810), PropTypeData's two relocated pointers move
+0x3C/+0x40 -> +0x40/+0x48 within an unchanged 112-byte stride, and PropPartTypeData grows
48 -> 64 (maCollisionVolumes +0x24 -> +0x28). The 96-byte rwcollision Volume records are a
pure dword flip. Array bounds 500/300/2048 are pinned by the FixUp @0x8267F570 table bases;
the member set is DecFIGS DWARF. muSizeInBytes is LITTLE-endian on the BE disk (ARTIST
bake-tool anomaly, the PropGraphicsList precedent) and is recomputed for the widened blob.
Pinned on the C++ side by BrnPhysicsPropTypeData.h / BrnPropPhysicsDataHeader.h
_AssertLayout() and the static_asserts in BrnPropPhysicsListResourceType.cpp."""

[[rule]]
id     = "unhandled-particles"
match  = ["PARTICLES.BUNDLE"]
action = "unhandled"
reason = """PARTICLES.BUNDLE is bnd2 platform 2 with no rule, and is present in build/game
at platform 2 byte-identical to retail (inert). Its ParticleDescriptionCollection /
ParticleDescription payloads have no porter in this repo. (PROPS/PROPPHYSICS.BUNDLE was
split out of this rule and now has a real converter -- see "prop-physics" above.)"""

[[rule]]
id     = "unhandled-misc-root-bundles"
match  = ["PLAYBACKREGISTRY.BUNDLE", "RWACFEATUREREGISTRY.BUNDLE",
          ]
action = "unhandled"
reason = """Two small Registry containers remain. Their payloads use Entity subclasses
outside the proven ContentSpec-only schema. Existing build/game copies are byte-identical
platform-2 files and therefore inert. They stay UNHANDLED so the report cannot count them as
success."""
